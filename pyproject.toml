[project]
name = "hab-rbot-trader-tests"
version = "0.1.0"
description = "Unit tests for HAB XAU ATP PEX trading EA logic"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8.0"]
lint = ["ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
